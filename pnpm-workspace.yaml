minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
# Releases on an older major published after a newer major gained stronger
# trust evidence. Verified 2026-10-17: lockfile integrity matches the registry
# and each was published by the project's maintainer or release bot. Excluding
# them avoids falling back to older patches that lack their security fixes.
trustPolicyExclude:
  - chokidar@4.0.3
  - rollup@3.30.0
  - semver@5.7.2
  - semver@6.3.1
  - undici@5.29.0
  - vite@4.5.14
  - vite@5.4.21
trustPolicyExcludePrune: true

shellEmulator: true

packages:
  - examples/*

allowBuilds:
  esbuild: true
  sharp: true

catalogs:
  examples:
    '@fontsource/abeezee': ^5.2.8
    '@fontsource/truculenta': ^5.2.7
  shared:
    typescript: ^6.0.3
